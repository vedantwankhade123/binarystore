[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin", "cloudinary"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/shop-api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/profile-image/google/a/*"
  to = "https://lh3.googleusercontent.com/a/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/profile-image/google/a-/*"
  to = "https://lh3.googleusercontent.com/a-/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  framework = "#custom"
  command = "npm run dev -- --host 127.0.0.1"
  targetPort = 5173
  port = 8888
  autoLaunch = false
